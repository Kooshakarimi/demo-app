name: Two Environment Pipeline

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          mkdir -p dist
          echo "Version: ${GITHUB_SHA::7}" > dist/app.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: dist/

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app-build
          path: dist/

      - name: Show version
        run: cat dist/app.txt

      - name: Deploy to staging
        run: echo "Deploying to STAGING..."

      - name: Smoke test staging
        run: echo "Staging smoke test passed"

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app-build
          path: dist/

      - name: Show version
        run: cat dist/app.txt

      - name: Deploy to production
        run: echo "Deploying to PRODUCTION..."
