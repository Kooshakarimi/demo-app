name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Print a greeting
        run: echo "Hello from the CI pipeline!"

      - name: Show the runner's OS
        run: uname -a
